[profile.t2]
retries = 0
fail-fast = false
test-threads = 2
slow-timeout = { period = "180s", terminate-after = 1 }

[profile.t2.junit]
path = "foundation.xml"

# These proofs run installation-wide workers on the shared database; they can advance other fixtures.
# ref: nextest site/src/docs/configuration/threads-required.md
[[profile.t2.overrides]]
filter = 'test(=assembly::execution_owners_t2::inventory::projection::report_page_settlement_and_cost) | test(=assembly::execution_owners_t2::inventory::capacity::complete_large_report_survives_authenticated_intake_replay_and_projection) | test(=assembly::execution_owners_t2::inventory::report_and_projection_progress_while_a_peer_is_blocked) | test(=assembly::telemetry_queries_t2::complete_stream_qualification) | test(=assembly::telemetry_queries_t2::exact_integer_queries_and_live_authorization) | test(assembly::execution_owners_t2::workers::) | test(=assembly::directory_queries_t2::public_business_fields_reach_objects_beyond_the_first_page) | test(=assembly::operation_diagnostics_t2::product_http_uses_original_owner_namespaces_and_consumable_cursors) | test(=assembly::owner_boundaries_t2::asset_inputs::actual_workers_recover_events_and_preserve_entry_without_idle_input_polling) | test(=assembly::owner_boundaries_t2::asset_inputs::coalesced_static_edit_and_scope_request_are_not_acknowledged_by_old_tasks) | test(=assembly::owner_boundaries_t2::asset_inputs::compliance_workers_share_candidate_and_freshness_semantics) | test(=assembly::owner_boundaries_t2::asset_inputs::input_health_is_durable_across_instances) | test(local_delivery_rotates_past_a_locked_first_tenant_and_a_full_page) | test(local_delivery_refills_while_a_group_head_is_in_flight) | test(advances_while_a_peer_checkpoint_is_locked) | test(independent_tenants_progress_through_live_apple_workers) | test(stalled_receiver_allows_other_fanout_and_http_settlement) | test(failed_page_recovers_without_hint_and_invalid_channel_leaves_discovery) | test(unfinished_package_resumes_after_restart_and_replays_exact_bytes) | test(event_batch_commits_during_a_peer_receipt_lock) | test(configured_wns_capacity_measures_actual_sends_and_settlements) | test(independent_source_commits_before_slow_content_returns)'
threads-required = "num-test-threads"

# Installed-host journeys retain their individual provider and recovery deadlines.
# Each baseline retains the production worker schedule and the proof's existing 120s completion bound.
[[profile.t2.overrides]]
filter = 'test(=foundation_t2::lifecycle::installation::installed_service_creates_another_tenant_without_reassembly)'
slow-timeout = { period = "360s", terminate-after = 1 }

# Four telemetry profiles include a cold restore, two further tenant provisions and a dedicated-host restart.
[[profile.t2.overrides]]
filter = 'test(=foundation_t2::shared_telemetry_on_a_running_installation)'
slow-timeout = { period = "480s", terminate-after = 1 }

# The DA host exercises two real Keycloak TOTP ceremonies and the full device lifecycle in one installation.
[[profile.t2.overrides]]
filter = 'test(=foundation::independent_registration_and_rolling_configuration_trust)'
slow-timeout = { period = "420s", terminate-after = 1 }
