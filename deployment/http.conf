    upstream mdm_backend { server 127.0.0.1:8081; }
    server {
        listen 127.0.0.1:8445 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        if ($ssl_server_name != $host) { return 421; }
        server_name mdm.example.test;
        ssl_certificate /private/mdm-tls.crt;
        ssl_certificate_key /private/mdm-tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn mdm_peer_connections 8;
        limit_conn mdm_server_connections 128;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host mdm.example.test;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream off;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header Retry-After 3 always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
            return 429 '{"code":"request_limited"}';
        }
        location ~ ^/api/v1/identity/tenants/[^/]+/(login|session/reauthenticate)$ {
            limit_req zone=mdm_login burst=10 nodelay;
            proxy_pass http://mdm_backend;
        }
        location = /api/v1/identity-host/config.json {
            default_type application/json;
            alias /run/config/ui.json;
        }
        location = /api/v1/mdm-host/config.json {
            default_type application/json;
            alias /run/config/mdm.json;
        }
        location = /api/v1/identity/oidc/callback {
            limit_req zone=mdm_api burst=20 nodelay;
            proxy_pass http://mdm_backend;
        }
        # Exact content routes stream to the authenticated bounded store; never spool full installers.
        # Match this deployment ceiling to content.max_artifact_bytes (example: 8 GiB).
        location ~ ^/api/v1/resources/[^/]+/(content|uploads/[^/]+)$ {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 8g;
            client_body_timeout 30s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_pass http://mdm_backend;
        }
        # Route ceilings mirror management-http/body_policy.rs; Rust also checks the method.
        # ref: nginx ngx_http_core_module.c@release-1.28.0 (location body-size inheritance)
        location ~ ^/api/v1/(resources/[^/]+|policies/[^/]+)$ {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 8m;
            proxy_pass http://mdm_backend;
        }
        location ~ ^/api/v1/devices/[^/]+/operations$ {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 16m;
            proxy_pass http://mdm_backend;
        }
        location ~ ^/api/v1/pki/(rotations|crls)$ {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 64m;
            proxy_pass http://mdm_backend;
        }
        location = /api/v1/pki/signing/recover {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 256k;
            proxy_pass http://mdm_backend;
        }
        location ~ ^/api/v1/apple/materials/ {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 256k;
            proxy_pass http://mdm_backend;
        }
        location = /api/v1/windows/entra-policy {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 128k;
            proxy_pass http://mdm_backend;
        }
        location ~ ^/api/v1/(certificate-archive/import|authorization/(rules|user-groups)/[^/]+|tenant-administration/authorization/rules/[^/]+)$ {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 2m;
            proxy_pass http://mdm_backend;
        }
        location ~ ^/api/v1/(agent-packages(/[^/]+/withdraw)?|software/(imports|sources/[^/]+/revisions/[^/]+|resources/[^/]+/versions/[^/]+))$ {
            limit_req zone=mdm_api burst=20 nodelay;
            client_max_body_size 1m;
            proxy_pass http://mdm_backend;
        }
        location ~ ^/api/v1/software/ {
            limit_req zone=mdm_api burst=20 nodelay;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_pass http://mdm_backend;
        }
        # Anonymous package reads reuse the catalogue owner on the private management listener.
        # Registration/runtime remain on the dedicated Agent TLS listener.
        location ~ ^/api/v1/agent/enroll/(packages(/[0-9a-fA-F-]+(/content)?)?)$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            limit_req zone=mdm_api burst=20 nodelay;
            proxy_pass_request_headers off;
            proxy_set_header Host mdm.example.test;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            rewrite ^/api/v1/agent/enroll/(.*)$ /api/v1/public-agent/$1 break;
            proxy_pass http://mdm_backend;
        }
        # Agent enrollment/runtime use their dedicated Rust TLS listener and actual TLS peer.
        location /api/v1/agent/ { default_type application/json; return 404 '{"code":"not_found"}'; }
        location ^~ /api/v1/public-agent/ { default_type application/json; return 404 '{"code":"not_found"}'; }
        location ^~ /software/native/ { default_type application/json; return 404 '{"code":"not_found"}'; }
        location = /api { default_type application/json; return 404 '{"code":"not_found"}'; }
        location /api/ { limit_req zone=mdm_api burst=20 nodelay; proxy_pass http://mdm_backend; }
        location = /livez { proxy_pass http://mdm_backend; }
        location = /readyz { proxy_pass http://mdm_backend; }
        # MDM_SCEP_LOCATIONS
        # CA APIs never fall through to either the backend or the SPA.
        location ~ ^/(scep|admin|sign|revoke|renew|rekey|provisioners|roots|root|crl|health)(/|$) {
            default_type application/json;
            return 404 '{"code":"not_found"}';
        }
        location / {
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $web_origin http://web:8080;
            proxy_pass $web_origin;
        }
    }
