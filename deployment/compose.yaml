# One resource definition for worktree development and T2.
services:
  postgres:
    image: ${MDM_POSTGRES_IMAGE:?}
    labels: &owner
      rss.mdm.worktree: ${MDM_WORKTREE_ID:?}
    environment:
      POSTGRES_PASSWORD_FILE: /inputs/pg-password
    ports: ["127.0.0.1::5432"]
    volumes:
      - pg:/var/lib/postgresql/data
      - ${MDM_ENV_ROOT:?}:/inputs:ro
    command: [sh, -ec, 'cp /inputs/server.key /tmp/server.key; cp /inputs/server.crt /tmp/server.crt; chown postgres:postgres /tmp/server.*; chmod 600 /tmp/server.key; exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key']
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 1s
      timeout: 3s
      retries: 60
  idp-netns:
    profiles: [idp]
    image: ${MDM_RUNTIME_IMAGE:?}
    labels: *owner
    command: [sh, -c, 'exec sleep infinity']
    ports: ["127.0.0.1::8443"]
  idp-inputs:
    profiles: [idp]
    image: ${MDM_RUNTIME_IMAGE:?}
    labels: *owner
    user: "0:0"
    network_mode: none
    volumes: ["${MDM_ENV_ROOT:?}/idp:/inputs:ro", "idp:/private"]
    command: [sh, -ec, 'cp /inputs/* /private/; chown -R 1000:1000 /private; chmod 700 /private; chmod 600 /private/*']
  idp:
    profiles: [idp]
    image: ${MDM_KEYCLOAK_IMAGE:?}
    labels: *owner
    network_mode: service:idp-netns
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-operator
      KC_BOOTSTRAP_ADMIN_PASSWORD: fixture-operator-password
    volumes: ["idp:/opt/keycloak/data/import:ro"]
    command: [start-dev, --import-realm, --http-enabled=false, "--hostname=${MDM_IDP_ORIGIN:-https://localhost:8443}", --https-certificate-file=/opt/keycloak/data/import/server.crt, --https-certificate-key-file=/opt/keycloak/data/import/server.key]
    depends_on: [idp-netns]
  runtime-netns:
    profiles: [product]
    image: ${MDM_RUNTIME_IMAGE:?}
    labels: *owner
    command: [sh, -c, 'exec sleep infinity']
    ports: ["127.0.0.1::8445"]
  inputs:
    profiles: [product]
    image: ${MDM_RUNTIME_IMAGE:?}
    labels: *owner
    user: "0:0"
    network_mode: none
    volumes:
      - ${MDM_ENV_ROOT:?}/container:/inputs:ro
      - runtime:/out/runtime
      - operator:/out/operator
      - gateway:/out/gateway
      - content:/content
    command: [sh, -ec, 'for group in runtime operator gateway; do cp /inputs/$$group/* /out/$$group/; chown -R 10001:10001 /out/$$group; chmod 700 /out/$$group; chmod 600 /out/$$group/*; done; chown 10001:10001 /content']
  operator:
    profiles: [product]
    image: ${MDM_SERVER_IMAGE:-rss-mdm-local:unbuilt}
    labels: *owner
    volumes: ["operator:/run/mdm:ro"]
  server:
    profiles: [product]
    image: ${MDM_SERVER_IMAGE:-rss-mdm-local:unbuilt}
    labels: *owner
    network_mode: service:runtime-netns
    volumes: ["runtime:/run/mdm:ro", "content:/var/lib/mdm/content"]
    command: [serve, --config, /run/mdm/runtime.json]
    depends_on: [runtime-netns]
  gateway:
    profiles: [product]
    image: ${MDM_WEB_IMAGE:-rss-mdm-web:unavailable}
    labels: *owner
    network_mode: service:runtime-netns
    volumes: ["gateway:/certs:ro"]
    entrypoint: [nginx]
    command: [-e, stderr, -c, /certs/nginx.conf, -g, 'daemon off;']
    depends_on: [runtime-netns]
volumes:
  idp:
    labels: *owner
  pg:
    labels: *owner
  runtime:
    labels: *owner
  operator:
    labels: *owner
  gateway:
    labels: *owner
  content:
    labels: *owner
networks:
  default:
    labels: *owner
