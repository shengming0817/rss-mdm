# One resource definition for worktree development and T2.
# Deployment-specific values are supplied by an ignored .env or explicit --env-file.
x-gateway:
  origin: ${MDM_PRODUCT_ORIGIN:-}
  bind_ip: ${MDM_GATEWAY_BIND_IP:-127.0.0.1}
  certificate_file: ${MDM_GATEWAY_TLS_CERT_FILE:-}
  key_file: ${MDM_GATEWAY_TLS_KEY_FILE:-}
services:
  postgres:
    image: ${MDM_POSTGRES_IMAGE:?}
    labels: &owner
      rss.mdm.worktree: ${MDM_WORKTREE_ID:?}
    environment:
      POSTGRES_PASSWORD_FILE: /inputs/pg-password
      POSTGRES_DB: ${MDM_PG_DATABASE:-postgres}
    ports: ["127.0.0.1::5432"]
    volumes:
      - pg:/var/lib/postgresql/data
      - ${MDM_ENV_ROOT:?}/pg/server.crt:/inputs/server.crt:ro
      - ${MDM_ENV_ROOT:?}/pg/server.key:/inputs/server.key:ro
      - ${MDM_ENV_ROOT:?}/pg/pg-password:/inputs/pg-password:ro
    networks:
      default:
        aliases: ["${MDM_PG_HOST:-postgres}"]
    command: [sh, -ec, 'cp /inputs/server.key /tmp/server.key; cp /inputs/server.crt /tmp/server.crt; chown postgres:postgres /tmp/server.*; chmod 600 /tmp/server.key; exec docker-entrypoint.sh postgres -c max_connections=${MDM_PG_MAX_CONNECTIONS:-160} -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key']
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      start_period: 60s
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 6
  gateway-probe:
    profiles: [probe]
    image: ${MDM_NGINX_IMAGE:?}
    user: "${MDM_GATEWAY_PROBE_USER:-0:0}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    labels: *owner
    # The probe consumes the production renderer's target ports.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["${MDM_GATEWAY_PROBE_DIRECTORY:-${MDM_ENV_ROOT:?}/probe}/nginx.conf:/tmp/input.conf:ro", "${MDM_GATEWAY_PROBE_DIRECTORY:-${MDM_ENV_ROOT:?}/probe}:/run/probe:ro"]
    entrypoint: [nginx, -e, stderr, -c, /tmp/input.conf, -g, 'daemon off;']
  step-ca:
    networks:
      default:
        aliases: ["${MDM_PKI_INTERNAL_HOST:-step-ca}"]
    profiles: [pki]
    image: ${MDM_STEP_CA_IMAGE:?}
    labels: *owner
    user: ${MDM_PKI_USER:?}
    restart: "no"
    entrypoint: [/usr/local/bin/step-ca]
    command: ["${MDM_PKI_ROOT:?}/step/config/ca.json", --password-file, "${MDM_PKI_ROOT}/step-password"]
    environment:
      STEPPATH: ${MDM_PKI_ROOT}/step
    extra_hosts: ["mdm.example.test:${MDM_PKI_HOST_ADDRESS:?}"]
    ports: ["${MDM_PKI_PUBLISH:-127.0.0.1::${MDM_STEP_CA_INTERNAL_PORT:?}}"]
    volumes:
      - type: bind
        source: ${MDM_PKI_ROOT}/step
        target: ${MDM_PKI_ROOT}/step
        bind:
          create_host_path: false
      - type: bind
        source: ${MDM_PKI_ROOT}/step-password
        target: ${MDM_PKI_ROOT}/step-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      disable: true
  idp-netns:
    profiles: [idp]
    image: ${MDM_RUNTIME_IMAGE:?}
    labels: *owner
    command: [sh, -c, 'exec sleep infinity']
    ports: ["127.0.0.1::8443"]
  idp-inputs:
    profiles: [idp]
    image: ${MDM_RUNTIME_IMAGE:?}
    labels: *owner
    user: "0:0"
    network_mode: none
    volumes: ["${MDM_ENV_ROOT:?}/idp:/inputs:ro", "idp:/private"]
    command: [sh, -ec, 'cp /inputs/* /private/; chown -R 1000:1000 /private; chmod 700 /private; chmod 600 /private/*']
  idp:
    profiles: [idp]
    image: ${MDM_KEYCLOAK_IMAGE:?}
    labels: *owner
    network_mode: service:idp-netns
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: fixture-operator
      KC_BOOTSTRAP_ADMIN_PASSWORD: fixture-operator-password
    volumes: ["idp:/opt/keycloak/data/import:ro"]
    command: [start-dev, --import-realm, --http-enabled=false, "--hostname=${MDM_IDP_ORIGIN:-https://localhost:8443}", --https-certificate-file=/opt/keycloak/data/import/server.crt, --https-certificate-key-file=/opt/keycloak/data/import/server.key]
    depends_on: [idp-netns]
  inputs:
    profiles: [product]
    image: ${MDM_RUNTIME_IMAGE:?}
    labels: *owner
    user: "0:0"
    network_mode: none
    volumes:
      - ${MDM_ENV_ROOT:?}/container:/inputs:ro
      - type: bind
        source: ${MDM_GATEWAY_TLS_CERT_FILE:-${MDM_ENV_ROOT}/container/gateway/server.crt}
        target: /tls-input/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MDM_GATEWAY_TLS_KEY_FILE:-${MDM_ENV_ROOT}/container/gateway/server.key}
        target: /tls-input/server.key
        read_only: true
        bind:
          create_host_path: false
      - runtime:/out/runtime
      - operator:/out/operator
      - gateway:/out/gateway
      - content:/content
    command:
      - sh
      - -ec
      - |
        for group in runtime operator gateway; do cp /inputs/$$group/* /out/$$group/; done
        cp /tls-input/server.crt /out/gateway/server.crt
        cp /tls-input/server.key /out/gateway/server.key
        for group in runtime operator gateway; do
          chown -R 10001:10001 /out/$$group
          chmod 700 /out/$$group
          chmod 600 /out/$$group/*
        done
        chown 10001:10001 /content
  operator:
    profiles: [product]
    image: ${MDM_SERVER_IMAGE:-rss-mdm-local:unbuilt}
    labels: *owner
    volumes: ["operator:/run/mdm:ro"]
  server:
    stop_grace_period: 75s
    profiles: [product]
    image: ${MDM_SERVER_IMAGE:-rss-mdm-local:unbuilt}
    labels: *owner
    networks:
      default: {}
      ingress: {ipv4_address: "${MDM_BACKEND_ADDRESS:-}"}
    volumes: ["runtime:/run/mdm:ro", "content:/var/lib/mdm/content"]
    command: [serve, --config, "/run/mdm/${MDM_SERVER_CONFIG:-runtime.json}"]
  gateway:
    profiles: [product]
    image: ${MDM_NGINX_IMAGE:?}
    user: "10001:10001"
    labels: *owner
    networks:
      default: {aliases: ["${MDM_PRODUCT_HOST:-mdm.example.test}"]}
      ingress: {ipv4_address: "${MDM_GATEWAY_ADDRESS:-}"}
      frontend: {}
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    # Published ports are supplied by the required renderer-generated override.
    volumes: ["gateway:/certs:ro"]
    entrypoint: [nginx]
    command: [-e, stderr, -c, /certs/nginx.conf, -g, 'daemon off;']
  web:
    profiles: [product]
    image: ${MDM_WEB_IMAGE:-rss-mdm-web:unavailable}
    user: "10001:10001"
    labels: *owner
    networks: [frontend]

volumes:
  idp:
    labels: *owner
  pg:
    labels: *owner
  runtime:
    labels: *owner
  operator:
    labels: *owner
  gateway:
    labels: *owner
  content:
    labels: *owner
networks:
  ingress:
    internal: true
    ipam:
      config: [{subnet: "${MDM_INGRESS_SUBNET:-}"}]
    labels: *owner
  frontend:
    internal: true
    labels: *owner
  default:
    name: ${MDM_NETWORK_NAME:-${COMPOSE_PROJECT_NAME}_default}
    labels: *owner
