# Required ingress profile: connect clients directly to this TLS proxy.
# Replace the host/certificate paths to match the reviewed MDM product_origin.
# The backend remains loopback-only; do not expose it through another unbounded proxy.
pid /tmp/mdm-nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_max_body_size 16k;
    large_client_header_buffers 4 8k;
    # Origin is a browser CSRF check, not source authentication. Only the actual peer
    # keys the login admission budget; caller-supplied forwarding headers cannot reset it.
    limit_req_zone $binary_remote_addr zone=mdm_login:10m rate=20r/m;
    limit_req_status 429;
    upstream mdm_backend { server 127.0.0.1:8081; }
    server {
        listen 443 ssl;
        server_name mdm.example.test;
        ssl_certificate /private/mdm-tls.crt;
        ssl_certificate_key /private/mdm-tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host mdm.example.test;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_next_upstream off;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header Retry-After 3 always;
            return 429 '{"code":"login_rate_limited"}';
        }
        location = /auth/login {
            limit_req zone=mdm_login burst=10 nodelay;
            proxy_pass http://mdm_backend;
        }
        location / { proxy_pass http://mdm_backend; }
    }
}
