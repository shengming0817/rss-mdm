# Required ingress profile: connect clients directly to this TLS proxy.
# Replace the host/certificate paths to match the reviewed MDM product_origin.
# The backend remains loopback-only; do not expose it through another unbounded proxy.
pid /tmp/mdm-nginx.pid;
error_log stderr crit;
events { worker_connections 1024; }
http {
    # Never log request URLs, headers or bodies (the callback URL contains a code).
    log_format mdm_safe escape=json '{"event":"mdm_gateway","request_id":"$request_id","upstream_request_id":"$upstream_http_x_request_id","status":$status,"latency_seconds":$request_time}';
    access_log /dev/stdout mdm_safe;
    client_max_body_size 16k;
    large_client_header_buffers 4 8k;
    # Origin is a browser CSRF check, not source authentication. Only the actual peer
    # keys the login admission budget; caller-supplied forwarding headers cannot reset it.
    limit_req_zone $binary_remote_addr zone=mdm_login:10m rate=20r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=mdm_peer_connections:10m;
    limit_conn_zone $server_name zone=mdm_server_connections:1m;
    limit_conn_status 429;
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/mdm-body;
    proxy_temp_path /tmp/mdm-proxy;
    fastcgi_temp_path /tmp/mdm-fastcgi;
    uwsgi_temp_path /tmp/mdm-uwsgi;
    scgi_temp_path /tmp/mdm-scgi;
    upstream mdm_backend { server 127.0.0.1:8081; }
    server {
        listen 443 ssl;
        server_name mdm.example.test;
        ssl_certificate /private/mdm-tls.crt;
        ssl_certificate_key /private/mdm-tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn mdm_peer_connections 8;
        limit_conn mdm_server_connections 128;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 10s;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host mdm.example.test;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream off;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header Retry-After 3 always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
            return 429 '{"code":"request_limited"}';
        }
        location ~ ^/api/v2/tenants/[^/]+/(login|session/reauthenticate)$ {
            limit_req zone=mdm_login burst=10 nodelay;
            proxy_pass http://mdm_backend;
        }
        location = /api/identity-host/v1/config.json {
            default_type application/json;
            alias /run/config/ui.json;
        }
        location = /api { default_type application/json; return 404 '{"code":"not_found"}'; }
        location /api/ { proxy_pass http://mdm_backend; }
        location = /livez { proxy_pass http://mdm_backend; }
        location = /readyz { proxy_pass http://mdm_backend; }
        root /usr/share/nginx/html;
        location / { try_files $uri $uri/ /index.html; }
    }
}
