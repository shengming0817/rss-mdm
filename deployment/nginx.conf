# Single public SNI ingress. Generated per-host routes and HTTP blocks share this owner.
pid /tmp/mdm-nginx.pid;
error_log stderr crit;
events { worker_connections 1024; }
stream {
    map $ssl_preread_server_name $mdm_target {
        default "";
        include /run/gateway/routes/*.conf;
    }
    server {
        listen 8443;
        ssl_preread on;
        preread_timeout 5s;
        proxy_connect_timeout 5s;
        proxy_timeout 3600s;
        proxy_protocol on;
        proxy_pass $mdm_target;
    }
}
http {
    # Never log request URLs, headers or bodies (the callback URL contains a code).
    log_format mdm_safe escape=json '{"event":"mdm_gateway","request_id":"$request_id","upstream_request_id":"$upstream_http_x_request_id","status":$status,"latency_seconds":$request_time}';
    access_log /dev/stdout mdm_safe;
    client_max_body_size 16k;
    large_client_header_buffers 4 8k;
    # Origin is a browser CSRF check, not source authentication. Only the actual peer
    # keys the login admission budget; caller-supplied forwarding headers cannot reset it.
    limit_req_zone $binary_remote_addr zone=mdm_login:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=mdm_api:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=mdm_peer_connections:10m;
    limit_conn_zone $server_name zone=mdm_server_connections:1m;
    limit_conn_status 429;
    include /etc/nginx/mime.types;
    client_body_temp_path /tmp/mdm-body;
    proxy_temp_path /tmp/mdm-proxy;
    fastcgi_temp_path /tmp/mdm-fastcgi;
    uwsgi_temp_path /tmp/mdm-uwsgi;
    scgi_temp_path /tmp/mdm-scgi;
    include /run/gateway/http/*.conf;
}
