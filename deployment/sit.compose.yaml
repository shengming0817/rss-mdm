# Add to production.compose.yaml after preparing the existing CA/storage volumes.
# Device traffic enters through the single 443 gateway; CA and RustFS stay private.
services:
  step-ca:
    image: ${MDM_STEP_CA_IMAGE:?fixed step-ca image required}
    user: "10001:10001"
    entrypoint: [/usr/local/bin/step-ca]
    command: [/home/step/config/ca.json, --password-file, /home/step/password]
    environment: {STEPPATH: /home/step}
    volumes: ["pki:/home/step"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, /usr/local/bin/step, ca, health, --ca-url, "https://step-ca:9000", --root, /home/step/certs/root_ca.crt]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  rustfs:
    image: ${MDM_RUSTFS_IMAGE:?fixed RustFS image required}
    user: "10001:10001"
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY_FILE: /tls/access-key
      RUSTFS_SECRET_KEY_FILE: /tls/secret-key
      RUSTFS_TLS_PATH: /tls
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: ["rustfs:/data", "rustfs-tls:/tls:ro"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /tls/ca.crt, "https://rustfs:9000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  ca-init:
    extends: {file: production.compose.yaml, service: init}
    environment:
      MDM_STEP_CA_CONFIG: /inputs/step-ca.json
      MDM_INITIALIZE_CA_ONLY: "1"
    depends_on:
      init: {condition: service_completed_successfully}
      step-ca: {condition: service_healthy}
    restart: on-failure

volumes:
  pki: {external: true, name: "${MDM_CA_VOLUME:-rss-mdm_pki}"}
  rustfs: {external: true, name: "${MDM_RUSTFS_VOLUME:-rss-mdm_rustfs}"}
  rustfs-tls: {external: true, name: "${MDM_RUSTFS_TLS_VOLUME:-rss-mdm_rustfs_tls}"}
