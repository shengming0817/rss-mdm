# Run after preparing this tenant's runtime inputs. Capacity is managed by operations.
services:
  server:
    extends: {file: production.compose.yaml, service: server}
    depends_on: !reset {}
    networks:
      ingress: {ipv4_address: "${MDM_BACKEND_ADDRESS:?tenant backend address required}"}
      default:
        aliases: !override ["${MDM_SERVER_ALIAS:?}"]
    volumes: !override
      - content:/var/lib/rss-mdm-content
      - temporary:/var/lib/rss-mdm-temporary
      - type: volume
        source: state
        target: /run/mdm
        read_only: true
        volume: {subpath: "${MDM_RUNTIME_SUBPATH:?}/server", nocopy: true}
volumes:
  temporary:
  content: {external: true, name: "${MDM_CONTENT_VOLUME:?}"}
  state: {external: true, name: "${MDM_STATE_VOLUME:?}"}
networks:
  ingress: {external: true, name: "${MDM_INGRESS_NETWORK:?}"}
  default: {external: true, name: "${MDM_NETWORK:?}"}
