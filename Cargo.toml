# 与 RSS 一致的扁平 workspace；产品实现按职责放在 crates/ 下。
[workspace]
resolver = "3"
members = ["crates/management-http", "crates/apple-channel", "crates/windows-channel", "crates/agent-channel", "crates/flow-service", "crates/inventory-service", "crates/registration-service", "crates/authorization-service", "crates/content-service", "crates/certificate", "crates/apple-mdm", "crates/software-service", "crates/compliance", "crates/compliance-postgres", "crates/audit-integration", "crates/agent-wire", "crates/backend-postgres-support", "crates/resource", "crates/winget-source", "crates/brew-source", "crates/app", "crates/windows-mdm", "crates/inventory", "crates/inventory-postgres", "crates/examples", "crates/group", "crates/group-postgres", "crates/scope", "crates/policy", "crates/software-release", "crates/policy-postgres", "crates/resource-postgres", "crates/software-release-postgres"]
default-members = ["crates/management-http", "crates/apple-channel", "crates/windows-channel", "crates/agent-channel", "crates/flow-service", "crates/inventory-service", "crates/registration-service", "crates/authorization-service", "crates/content-service", "crates/certificate", "crates/apple-mdm", "crates/software-service", "crates/compliance", "crates/compliance-postgres", "crates/audit-integration", "crates/agent-wire", "crates/backend-postgres-support", "crates/resource", "crates/winget-source", "crates/brew-source", "crates/app", "crates/windows-mdm", "crates/inventory", "crates/inventory-postgres", "crates/examples", "crates/group", "crates/group-postgres", "crates/scope", "crates/policy", "crates/software-release", "crates/policy-postgres", "crates/resource-postgres", "crates/software-release-postgres"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
rss-mdm-management-http = { path = "crates/management-http" }
rss-mdm-apple-channel = { path = "crates/apple-channel" }
rss-mdm-windows-channel = { path = "crates/windows-channel" }
rss-mdm-agent-channel = { path = "crates/agent-channel" }
rss-mdm-flow-service = { path = "crates/flow-service" }
rss-mdm-inventory-service = { path = "crates/inventory-service" }
rss-mdm-registration-service = { path = "crates/registration-service" }
rss-mdm-authorization-service = { path = "crates/authorization-service" }
bytes = "1"
rss-mdm-content-service = { path = "crates/content-service" }
rss-mdm-certificate = { path = "crates/certificate" }
rss-mdm-apple-mdm = { path = "crates/apple-mdm" }
rss-mdm-software-service = { path = "crates/software-service" }
rss-mdm-compliance = { path = "crates/compliance" }
rss-mdm-compliance-postgres = { path = "crates/compliance-postgres" }
rss-mdm-audit-integration = { path = "crates/audit-integration" }
rss-audit-core = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-audit", rev = "4bfc1d62e609ad7aac977f569d81e5241212fb53" }
rss-audit-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-audit", rev = "4bfc1d62e609ad7aac977f569d81e5241212fb53", features = ["ledger", "messaging"] }
rss-ledger = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac" }
rss-ledger-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac" }
futures = "0.3"

plist = "=1.10.1"
cms = { version = "=0.2.3", default-features = false, features = ["std"] }
rss-mdm-backend-postgres-support = { path = "crates/backend-postgres-support" }
rss-mdm-agent-wire = { path = "crates/agent-wire" }
rss-mdm-software-release = { path = "crates/software-release" }
rss-mdm-resource = { path = "crates/resource" }
rss-mdm-winget-source = { path = "crates/winget-source" }
rss-mdm-brew-source = { path = "crates/brew-source" }
tempfile = "3"
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
jsonschema = { version = "=0.33.0", default-features = false }
rss-mdm-scope = { path = "crates/scope" }
rss-mdm-policy = { path = "crates/policy" }
rss-mdm-group = { path = "crates/group" }
rss-mdm-app = { path = "crates/app" }
rss-identity-core = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "987c3fef4d9338ff5313d6c8868fe1085f6f8480" }
rss-identity-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "987c3fef4d9338ff5313d6c8868fe1085f6f8480" }
rss-identity-http-axum = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "987c3fef4d9338ff5313d6c8868fe1085f6f8480" }
rss-identity-oidc = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "987c3fef4d9338ff5313d6c8868fe1085f6f8480" }
axum = { version = "=0.8.9", features = ["json", "query"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }
subtle = "2"
libc = "0.2"
rand = "0.8"
http-body-util = "0.1"
h2 = "=0.4.19"
tower = { version = "0.5", features = ["util"] }
rss-runtime = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }
rss-axum = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false, features = ["http1"] }
rss-mdm-windows-mdm = { path = "crates/windows-mdm" }
quick-xml = { version = "=0.42.0", default-features = false }
base64 = "=0.22.1"
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }
rss-mdm-inventory = { path = "crates/inventory" }
rss-mdm-inventory-postgres = { path = "crates/inventory-postgres" }
rss-mdm-examples = { path = "crates/examples" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "=0.17.14"
x509-cert = "=0.2.5"
md-5 = "=0.10.6"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }
rss-observation = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }
rss-observation-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false, features = ["projection-postgres"] }
rss-projection = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }
rss-projection-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }

rss-contract = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }

rss-mdm-group-postgres = { path = "crates/group-postgres" }
rss-transactional-messaging = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false, features = ["producer"] }
rss-transactional-messaging-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }
rss-transactional-messaging-runtime = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }

rss-mdm-policy-postgres = { path = "crates/policy-postgres" }
rss-mdm-resource-postgres = { path = "crates/resource-postgres" }
rss-mdm-software-release-postgres = { path = "crates/software-release-postgres" }

rss-device-command = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }
rss-device-command-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }
rss-reconcile = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false }
rss-reconcile-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "7c1ece8ce104f59ba06af5480a3386caabb974ac", default-features = false, features = ["transactional-messaging"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
