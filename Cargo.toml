# 与 RSS 一致的扁平 workspace；产品实现按职责放在 crates/ 下。
[workspace]
resolver = "3"
members = ["crates/resource", "crates/winget-source", "crates/brew-source", "crates/app", "crates/windows-mdm", "crates/inventory", "crates/inventory-postgres", "crates/examples", "tests/inventory-postgres-integration", "crates/group", "crates/scope", "crates/policy", "crates/software-release"]
default-members = ["crates/resource", "crates/winget-source", "crates/brew-source", "crates/app", "crates/windows-mdm", "crates/inventory", "crates/inventory-postgres", "crates/examples", "crates/group", "crates/scope", "crates/policy", "crates/software-release"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
rss-mdm-software-release = { path = "crates/software-release" }
rss-mdm-resource = { path = "crates/resource" }
rss-mdm-winget-source = { path = "crates/winget-source" }
rss-mdm-brew-source = { path = "crates/brew-source" }
tempfile = "3"
jsonschema = { version = "=0.33.0", default-features = false }
rss-mdm-scope = { path = "crates/scope" }
rss-mdm-policy = { path = "crates/policy" }
rss-mdm-group = { path = "crates/group" }
rss-mdm-app = { path = "crates/app" }
rss-identity-client = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "2e66cac2bb8064701c5e99c992858b178f875656" }
rss-identity-contracts = { git = "https://dev.azure.com/shengming0923/rss/_git/rss-identity", rev = "2e66cac2bb8064701c5e99c992858b178f875656" }
axum = { version = "=0.8.9", features = ["json", "query"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }
subtle = "2"
libc = "0.2"
rand = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
rss-runtime = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "e1dddb241c2bb015e7a8a71d0881d790d879fe9c", default-features = false }
rss-axum = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "e1dddb241c2bb015e7a8a71d0881d790d879fe9c", default-features = false, features = ["http1"] }
rss-mdm-windows-mdm = { path = "crates/windows-mdm" }
quick-xml = { version = "=0.42.0", default-features = false }
base64 = "=0.22.1"
time = { version = "=0.3.55", default-features = false, features = ["parsing"] }
rss-mdm-inventory = { path = "crates/inventory" }
rss-mdm-inventory-postgres = { path = "crates/inventory-postgres" }
rss-mdm-examples = { path = "crates/examples" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "=0.17.14"
x509-cert = "=0.2.5"
md-5 = "=0.10.6"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
rss-request-context = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "e1dddb241c2bb015e7a8a71d0881d790d879fe9c", default-features = false }
rss-observation = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "e1dddb241c2bb015e7a8a71d0881d790d879fe9c", default-features = false }
rss-observation-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "e1dddb241c2bb015e7a8a71d0881d790d879fe9c", default-features = false, features = ["projection-postgres"] }
rss-projection = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "e1dddb241c2bb015e7a8a71d0881d790d879fe9c", default-features = false }
rss-projection-postgres = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "e1dddb241c2bb015e7a8a71d0881d790d879fe9c", default-features = false }

rss-contract = { git = "https://dev.azure.com/shengming0923/rss/_git/rss", rev = "e1dddb241c2bb015e7a8a71d0881d790d879fe9c", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
